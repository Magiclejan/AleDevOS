name: AleDevOS Full Regression

concurrency:
  group: aledevos-full-regression-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  full-node-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run all portable Node regression files (no omissions)
        shell: bash
        env:
          ALEDEVOS_TEST_FILE_TIMEOUT_MS: "300000"
        run: |
          set -euo pipefail
          node scripts/ci/run-full-regression.mjs

  windows-integration-contract:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Windows Core and V1 package contract regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & node --test --test-reporter=tap tests/core-engine.test.mjs tests/v1-release-validation.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "WINDOWS_INTEGRATION_CONTRACT_FAILED" }
      - name: Validate Windows PowerShell release harness parser
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $paths = @('scripts/34-v1-target-runtime-smoke.ps1','scripts/35-self-test-v1-release-candidate.ps1','scripts/05-install-into-project.ps1')
          foreach ($file in $paths) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Error $_.Message }; throw "WINDOWS_SCRIPT_SYNTAX_INVALID:$file" }
          }

  full-source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify no generated state or stale test exclusions
        shell: bash
        run: |
          set -euo pipefail
          test_count="$(find tests -maxdepth 1 -type f -name '*.test.mjs' | wc -l | tr -d ' ')"
          if [ "$test_count" -lt 1 ]; then
            echo "NO_TESTS_DISCOVERED"
            exit 1
          fi
          if grep -R --line-number --include='*.test.mjs' -E '(^|[^A-Za-z])(test|it|describe)\.skip\(' tests; then
            echo "SKIPPED_TESTS_FORBIDDEN_IN_FULL_SUITE"
            exit 1
          fi
          echo "Full suite inventory PASS: $test_count test files"


  advanced-cert-chain-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify frozen P1-P5 package-only certificates against actual source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/refresh-advanced-certificates.mjs
