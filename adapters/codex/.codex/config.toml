# AleDevOS Codex adapter — project-local configuration
approval_policy = "never"
approvals_reviewer = "user"
model = "gpt-5.6-luna"
default_permissions = "aledevos_runtime"
allow_login_shell = false
web_search = "disabled"
developer_instructions = '''
AleDevOS root ingress is mandatory. Classify as project-actionable any request that requires reading/searching repository files, inspecting Git, running project commands/tests, analysing project architecture/config/code, creating project artifacts, modifying files, reviewing project risks, or producing project-specific recommendations.

For every project-actionable request, the root session MUST delegate first to the configured AleDevOS orchestrator before performing any repository read/search/command or project analysis. The root MUST NOT perform the project work itself. After delegation, relay the result only if a verifiable task artifact exists under .aledevos/state/tasks/<task_id>/. If the orchestrator cannot be invoked or task evidence is absent, return BLOCKED. Direct root answers are allowed only for pure conversational/meta requests requiring no project-specific operation.
'''

[features]
multi_agent = true
shell_tool = false
request_permissions_tool = false
apps = false
plugins = false

[features.code_mode]
enabled = false

[features.code_mode_host]
enabled = true

[agents]
enabled = true
max_concurrent_threads_per_session = 8
max_depth = 2
default_subagent_reasoning_effort = "low"

[agents.architect]
description = "Read-only architect."
config_file = "agents/architect.toml"

[agents.auditor]
description = "Read-only auditor."
config_file = "agents/auditor.toml"

[agents.builder]
description = "AleDevOS builder; product-only writes."
config_file = "agents/builder.toml"

[agents.design-system-guardian]
description = "Read-only Design System Guardian for UX/UI Phase 4."
config_file = "agents/design-system-guardian.toml"

[agents.editor-backend]
description = "AleDevOS editor-backend; product-only writes."
config_file = "agents/editor-backend.toml"

[agents.editor-config]
description = "High-risk project configuration editor; no shell."
config_file = "agents/editor-config.toml"

[agents.editor-database]
description = "AleDevOS editor-database; product-only writes."
config_file = "agents/editor-database.toml"

[agents.editor-frontend]
description = "AleDevOS editor-frontend; product-only writes."
config_file = "agents/editor-frontend.toml"

[agents.editor-tests]
description = "AleDevOS editor-tests; product-only writes."
config_file = "agents/editor-tests.toml"

[agents.judge-quality]
description = "Read-only judge-quality; evidence-based."
config_file = "agents/judge-quality.toml"

[agents.judge-regression]
description = "Read-only judge-regression; evidence-based."
config_file = "agents/judge-regression.toml"

[agents.judge-requirements]
description = "Read-only judge-requirements; evidence-based."
config_file = "agents/judge-requirements.toml"

[agents.judge-uxui]
description = "Read-only UX/UI Judge for Phase 4."
config_file = "agents/judge-uxui.toml"

[agents.motion-director]
description = "Read-only Motion Director for UX/UI Phase 5."
config_file = "agents/motion-director.toml"

[agents.orchestrator]
description = "Primary AleDevOS coordinator; no product edits."
config_file = "agents/orchestrator.toml"

[agents.repairer]
description = "AleDevOS repairer; product-only writes."
config_file = "agents/repairer.toml"

[agents.researcher]
description = "Read-only bounded repository mapper."
config_file = "agents/researcher.toml"

[agents.v1-release-validator]
