[agents.visual-runtime-audit-runner]
description = "Narrow Visual QA Phase 4 rendered runtime audit executor; no product edits."
config_file = "agents/visual-runtime-audit-runner.toml"

[permissions.aledevos_runtime]
description = "AleDevOS orchestrated runtime: product workspace writable, control plane protected, AleDevOS state writable, external filesystem/network denied."

[permissions.aledevos_runtime.filesystem]
":root" = "deny"
":minimal" = "read"
":workspace_roots" = { "." = "write", ".aledevos" = "write", ".aledevos/state" = "write", ".aledevos/adapters" = "read", ".aledevos/contextos" = "read", ".aledevos/efficiency" = "read", ".aledevos/execution" = "read", ".aledevos/knowledge" = "read", ".aledevos/multimodel" = "read", ".aledevos/project.json" = "read", ".aledevos/quality-engineering" = "read", ".aledevos/release" = "read", ".aledevos/reliability" = "read", ".aledevos/runtime" = "read", ".aledevos/schemas" = "read", ".aledevos/security-reliability" = "read", ".aledevos/skills" = "read", ".aledevos/skillsystem" = "read", ".aledevos/telemetry" = "read", ".aledevos/uxui" = "read", ".aledevos/visualqa" = "read", ".codex" = "read", ".agents" = "read", "AGENTS.md" = "read", "AGENTS.override.md" = "read", ".git" = "read" }

[permissions.aledevos_runtime.network]
enabled = false
allow_local_binding = true

[[hooks.PreToolUse]]
matcher = "^(apply_patch|Write|Edit|Bash)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "node .codex/hooks/aledevos-role-guard.mjs"
statusMessage = "AleDevOS role guard"
