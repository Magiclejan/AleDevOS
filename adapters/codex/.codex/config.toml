config_file = "agents/v1-release-validator.toml"

[agents.security-reviewer]
description = "Read-only AleDevOS AppSec reviewer."
config_file = "agents/security-reviewer.toml"

[agents.verifier]
description = "Read-only deterministic verifier; canonical gate only."
config_file = "agents/verifier.toml"

[agents.visual-capture-runner]
description = "Narrow Visual QA Phase 2 browser-capture executor; no product edits."
config_file = "agents/visual-capture-runner.toml"

[agents.visual-judge]
description = "AleDevOS Visual QA Phase 5 semantic/aesthetic judge; native-image observation only, no product edits."
config_file = "agents/visual-judge.toml"

[agents.visual-regression-runner]
description = "Narrow Visual QA Phase 3 baseline/regression executor; no product edits."
