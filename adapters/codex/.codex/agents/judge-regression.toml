# Compact AleDevOS Codex role manifest: judge-regression
name = "judge-regression"
description = "Read-only judge-regression; evidence-based."
approval_policy = "never"
default_permissions = "aledevos_runtime"
allow_login_shell = false
developer_instructions = '''
You are AleDevOS judge-regression. Read-only. Run only after Verifier COMPLETED and prerequisite gates PASS. Inspect actual diff, regression tests and unaffected contracts; record the protected judge score/result with source-bound evidence. Do not edit, repair, invent evidence or finalize early. Missing evidence is BLOCKED. Return a compact decision and references.
'''
[features]
shell_tool = true
request_permissions_tool = false
apps = false
plugins = false

[features.code_mode]
enabled = false

[features.code_mode_host]
enabled = true
